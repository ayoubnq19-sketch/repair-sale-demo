<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#059669">
<meta name="color-scheme" content="light">
<title>Repairs &amp; Sales – Phone Repair Shop Management App (Live Demo)</title>
<meta name="description" content="Live demo of a repair shop and sales management web app: track phone repairs and sales, customizable fields, thermal receipt printing, offline, Arabic (RTL), English and French.">
<meta name="keywords" content="repair shop software, phone repair management, sales tracker, receipt printing, thermal printer, Arabic RTL, multilingual, offline web app">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Repairs &amp; Sales – Repair Shop Management App (Live Demo)">
<meta property="og:description" content="Track repairs and sales, print receipts, works offline. Arabic (RTL), English, French.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5faf7;--card:#fff;--field:#f6f9f7;--ink:#10201a;--mut:#5f7068;--line:#e2ebe6;
  --pri:#059669;--priDk:#047857;--priBg:#e6f6ee;
  --warn:#b45309;--warnBg:#fef3c7;--warnSolid:#d97706;--danger:#dc2626;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Cairo',system-ui,-apple-system,'Segoe UI',Roboto,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
#side{position:fixed;inset-block:0;inset-inline-start:0;width:264px;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:18px 12px;z-index:40;transform:translateX(-102%);transition:transform .25s ease}
[dir=rtl] #side{transform:translateX(102%)}
#side.open,[dir=rtl] #side.open{transform:none;box-shadow:0 0 40px rgba(16,32,26,.18)}
.brand{padding:4px 6px 14px;border-bottom:1px solid var(--line)}
.brand small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pri);margin-bottom:2px}
#nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--mut);text-align:start;transition:background .15s,color .15s}
.nv:hover{background:var(--field)}
.nv.on{background:var(--priBg);color:var(--priDk)}
#scrim{position:fixed;inset:0;background:rgba(16,32,26,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
.main{min-height:100vh}
.bar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#burger{width:42px;height:42px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center}
#burger:active{background:var(--field)}
@media(min-width:900px){
  #side,[dir=rtl] #side{transform:none}
  #scrim{display:none}
  .main{margin-inline-start:264px}
  #burger{display:none}
  .bar{padding:0 28px}
}
.content{max-width:640px;margin:0 auto;padding:16px 16px 90px}

/* card + form */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(16,32,26,.04)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h2{font-size:18px;font-weight:800}
.link{border:0;background:transparent;color:var(--pri);font-weight:700;padding:6px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.fld{grid-column:span 2;min-width:0}
.fld.half{grid-column:span 1}
.lab{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;min-height:28px}
.lab label{font-size:13px;font-weight:700;color:var(--mut)}
.x{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-size:20px;line-height:1;opacity:.5}
.x:hover{opacity:1;color:var(--danger);background:var(--field)}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],textarea,select{
  width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:11px 14px;resize:vertical;min-height:70px}
input[type=date]{min-height:48px;direction:ltr;text-align:start}
input:focus,textarea:focus,select:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(5,150,105,.16)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.inwrap{position:relative}
.inwrap input{padding-inline-end:50px}
.suf{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:800;pointer-events:none}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--field);border:1px solid var(--line);border-radius:12px}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--mut);font-weight:700;transition:background .15s,color .15s}
.seg button.on{color:#fff}
.seg button.on.t-pri,.seg button.on.t-ok{background:var(--pri)}
.seg button.on.t-warn{background:var(--warnSolid)}

.step{display:flex;align-items:center;gap:8px}
.step button{flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-size:24px;line-height:1}
.step button:active{background:var(--priBg)}
.step input{width:84px;text-align:center}
.stepg{display:flex;align-items:center;gap:8px}
.step .unit{color:var(--mut);font-weight:600}
.dur{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dur select{flex:1;min-width:120px}

.addf{width:100%;margin-top:14px;height:44px;border:1.5px dashed #cfdcd5;background:transparent;border-radius:12px;color:var(--mut);font-weight:700}
.addf:hover{color:var(--pri);border-color:var(--pri)}
.panel{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--field);display:flex;flex-direction:column;gap:10px}
.panel input{background:#fff}
.ph{font-weight:800;font-size:14px}
.ph.sm{font-size:13px;color:var(--mut);margin-top:4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.ghost{border-style:dashed;color:var(--mut)}
.chip .n{opacity:.75;margin-inline-start:5px}
.prow{display:flex;gap:8px}
.btn{height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;flex:1}
.primary{width:100%;height:54px;margin-top:16px;border:0;border-radius:14px;background:var(--pri);color:#fff;font-size:17px;font-weight:800;box-shadow:0 4px 14px rgba(5,150,105,.28)}
.primary:hover{background:var(--priDk)}
.primary:active{transform:translateY(1px)}
.note{color:var(--mut);font-size:14px;padding:6px 0}

/* operations */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.otabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:14px}
.otabs button{height:42px;border:0;border-radius:11px;background:transparent;font-weight:700;color:var(--mut);transition:background .15s,color .15s}
.otabs button.on{background:var(--pri);color:#fff}
.otabs .n{opacity:.8;margin-inline-start:6px;font-weight:600}
#cards{display:flex;flex-direction:column;gap:12px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(16,32,26,.04)}
.rec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rec .t{font-size:17px;font-weight:800;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:13px;margin-top:2px}
.badge{flex:none;height:34px;padding:0 12px;border-radius:999px;border:0;font-weight:700;font-size:13.5px}
.badge span{opacity:.6;margin-inline-start:2px}
.badge.t-ok{background:var(--priBg);color:var(--priDk)}
.badge.t-warn{background:var(--warnBg);color:var(--warn)}
.badge.t-pri{background:var(--priBg);color:var(--priDk)}
.lines{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:4px 0}
.ln .k{color:var(--mut);font-size:13.5px}
.ln .v{font-weight:600;word-break:break-word;text-align:end}
.ln.price .v{color:var(--priDk);font-weight:800;font-size:17px}
.acts{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.acts button{flex:1;height:40px;border:0;background:var(--field);border-radius:10px;font-weight:700;font-size:14px}
.acts .ok{background:var(--pri);color:#fff;flex:1.4}
.acts .danger{color:var(--danger)}
.empty{text-align:center;color:var(--mut);padding:44px 10px;border:1.5px dashed #cfdcd5;border-radius:16px;background:#fff}

#toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));margin:0 auto;max-width:420px;background:#0f2b21;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.22);font-weight:600}
#toast.show{opacity:1;pointer-events:auto;transform:none}
#toast button{border:0;background:transparent;color:#6ee7b7;font-weight:800;padding:2px 4px}

/* multi-line fields */
.mrow{display:flex;gap:6px;margin-bottom:8px}
.mrow input{flex:1;min-width:0}
.mx{flex:none;width:46px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--mut);font-size:20px;line-height:1}
.mx:hover{color:var(--danger)}
.mrow:only-of-type .mx{display:none}
.madd{height:36px;border:0;background:transparent;color:var(--pri);font-weight:700;padding:0 2px}

.more{width:100%;height:46px;border:1.5px dashed #cfdcd5;background:#fff;border-radius:12px;color:var(--priDk);font-weight:700}
.more:hover{border-color:var(--pri)}
.count{text-align:center;color:var(--mut);font-size:13px;margin-top:2px}

/* receipt preview */
.modal{position:fixed;inset:0;z-index:70;background:rgba(16,32,26,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:440px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:17px;font-weight:800}
.x2{width:36px;height:36px;border:0;border-radius:10px;background:var(--field);font-size:22px;line-height:1}
.saved{background:var(--priBg);color:var(--priDk);font-weight:700;font-size:13.5px;padding:8px 16px}
.paperwrap{overflow:auto;background:#e8f0ec;padding:18px 12px;flex:1}
#paper{background:#fff;width:fit-content;margin:0 auto;padding:10px 12px;box-shadow:0 4px 18px rgba(16,32,26,.16)}
.sheet-f{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sheet-f .primary{margin-top:0}
.sheet-f .btn{width:100%}
.sheet-f .link{align-self:flex-start;padding:2px 0;font-size:13.5px}
.help{font-size:13px;color:var(--mut);background:var(--field);border-radius:12px;padding:10px 12px}
.help ol{padding-inline-start:18px;margin:6px 0}
.help code{background:#fff;padding:1px 5px;border-radius:5px;border:1px solid var(--line);font-size:12px;word-break:break-all}

/* receipt (preview + print) */
:root{--tw:72mm;--tf:12.5px}
.tk{width:var(--tw);color:#000;font-size:var(--tf);line-height:1.4;font-family:Arial,Helvetica,sans-serif;padding:2mm 0}
.tk h1{font-size:1.5em;text-align:center;margin:0 0 4px;font-weight:800;word-break:break-word}
.tk .sub{text-align:center;font-weight:700;border-top:1px dashed #000;border-bottom:1px dashed #000;padding:5px 0;margin:4px 0 6px}
.tk .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted #888}
.tk .row b{white-space:nowrap;font-weight:700}
.tk .row span{text-align:end;max-width:62%;word-break:break-word}
.tk .row.tot{font-size:1.2em;font-weight:800;border-bottom:1px solid #000}
.tk .foot{text-align:center;margin-top:10px;padding-top:8px;border-top:1px dashed #000}
.tk .thx{font-weight:800}
.tk .sm{font-size:.85em;margin-top:4px}
#printArea{position:absolute;left:-9999px;top:0;width:72mm;visibility:hidden;pointer-events:none}
#printArea .tk{margin:0 auto}
@page{margin:0}
@media print{
  html,body{height:auto!important;min-height:0!important;background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;left:auto;visibility:visible;width:100%}
  /* le reçu remplit la largeur du papier (ticket ou A4) ; la taille du texte suit la page */
  #printArea .tk{width:100%;max-width:none;margin:0;box-sizing:border-box;padding:.5em .7em;font-size:min(4.6vw,calc(94vh / var(--h,30)))}
  #printArea .tk .row{padding:.3em 0}
  #printArea .tk .sub{padding:.4em 0;margin:.3em 0 .5em}
  #printArea .tk .foot{margin-top:.8em;padding-top:.6em}
}

/* nom de boutique, réglages, écran d'accès */
.tk h1.ph0{color:#999;font-weight:600}
.irow .inwrap{flex:none;width:122px}
.irow .inwrap input{padding:0;padding-inline:10px 34px}
.irow .suf{inset-inline-end:10px;font-size:12px}
.tk .row.hd{border-bottom:0;padding-bottom:0}
.tk .row.it span:first-child{text-align:start;max-width:64%}
.tk .row.it .ip{white-space:nowrap;max-width:none}
.ln.item .k{color:var(--ink);font-weight:600;font-size:14px;text-align:start}
.shopn{font-size:18px;font-weight:800;padding:2px 0;word-break:break-word}
.shopn.empty{color:var(--mut);opacity:.6;font-weight:600}
#lockBtn{margin-top:auto}
.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;transform:none}
.err{color:var(--danger);font-size:13.5px;font-weight:600}
.err:empty{display:none}
.lockedname{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--field);font-weight:800;font-size:16px}
.lockedname svg{color:var(--mut)}
.lockedname span{word-break:break-word}
.stat{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--priBg);color:var(--priDk);font-weight:700;font-size:13.5px;align-self:flex-start}
.stat.off{background:var(--field);color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:12px}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:24px 16px}
.gcard{width:100%;max-width:440px;margin:auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 30px rgba(16,32,26,.08)}
.gcard h2{font-size:22px;font-weight:800}
.gp{color:var(--mut)}
.gname{font-size:22px;font-weight:800;text-align:center;word-break:break-word}
.gwarn{background:var(--warnBg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.gprev-t{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px}
.gpaper{background:#e8f0ec;border-radius:14px;padding:16px 10px;overflow:auto}
.gpin{background:#fff;width:fit-content;max-width:100%;margin:0 auto;padding:10px 12px;box-shadow:0 4px 18px rgba(16,32,26,.16)}
.gcard .primary{margin-top:2px}
.gcard .btn{width:100%}

/* ===== langues (ar / en / fr) et sens d'écriture ===== */
code{direction:ltr;unicode-bidi:isolate;display:inline-block}
.lang{display:inline-flex;flex:none;gap:2px;padding:3px;background:var(--field);border:1px solid var(--line);border-radius:10px}
.lang button{height:30px;min-width:34px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--mut);font-weight:700;font-size:13px;white-space:nowrap}
.lang button.on{background:var(--pri);color:#fff}
.lang.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:12px;gap:3px}
.lang.full button{height:44px;font-size:15px;border-radius:9px}
.lang.gl{align-self:flex-end}
@media(max-width:400px){.bar h1{font-size:16px}.bar{gap:6px;padding:0 8px}.lang button{min-width:30px;padding:0 7px}}
[dir=rtl] input[type=date]{text-align:right}
[dir=rtl] #toast{direction:rtl}
html[lang=ar] body{font-family:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic',system-ui,sans-serif;line-height:1.6}
/* l'espacement entre lettres et les majuscules cassent la liaison des lettres arabes */
html[lang=ar] *{letter-spacing:0!important}
html[lang=ar] .brand small{text-transform:none;font-size:12.5px}
html[lang=ar] .tk{font-family:Tahoma,Arial,'Noto Sans Arabic',sans-serif;line-height:1.6}
html[lang=ar] .inwrap input{padding-inline-end:56px}
html[lang=ar] .irow .inwrap input{padding-inline-end:44px}
html[lang=ar] .seg button,html[lang=ar] .chip,html[lang=ar] .acts button{font-size:14.5px}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <small id="brandsm">Ma boutique</small>
    <div id="shopn" class="shopn"></div>
  </div>
  <nav id="nav">
    <button type="button" class="nv" data-view="repair">
      <svg class="i" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L3 18l3 3 6.5-6.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
      <span data-i18n="nav.repair"></span>
    </button>
    <button type="button" class="nv" data-view="sale">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
      <span data-i18n="nav.sale"></span>
    </button>
    <button type="button" class="nv" data-view="ops">
      <svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span data-i18n="nav.ops"></span>
    </button>
    <button type="button" class="nv" data-view="settings">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="nav.settings"></span>

/* ---------- Stockage : IndexedDB (repli sur localStorage) ---------- */
const STORE='kv';
let useLS=false;
const dbp=new Promise(res=>{
  try{
    if(!window.indexedDB)return res(null);
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=r.onblocked=()=>res(null);
  }catch(e){res(null)}
});
function idbGet(db){return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbPut(db,val){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(val,'state');tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error)})}
async function loadState(){
  const db=await dbp;let st=null;
  if(db){try{st=await idbGet(db)}catch(e){useLS=true}}else useLS=true;
  if(!st){try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
  return st;
}
let dirty=false,wtimer=null;
function flush(){
  clearTimeout(wtimer);if(!dirty)return;dirty=false;
  if(useLS){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast(T('toast.storage'))}return}
  dbp.then(db=>{
    if(!db)return;
    idbPut(db,S).catch(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast(T('toast.saveFail'))}});
  });
}
const persist=()=>{dirty=true;clearTimeout(wtimer);wtimer=setTimeout(flush,200)};
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
function normalize(){

  S.sec.repair.fields.forEach(f=>{if(f.id==='work'&&f.type==='multi')f.type='items'});

function readForm(){

function itemsOf(raw){

function fmtVal(f,raw,print){
  if(raw===undefined||raw===null)return null;
  switch(f.type){
    case 'text':case 'long':{const s=String(raw).trim();if(!s)return f.empty?esc(FL(f,'empty')):null;return '<bdi>'+esc(s).replace(/\n/g,'<br>')+'</bdi>'}
    case 'multi':{const items=(Array.isArray(raw)?raw:[raw]).map(x=>String(x==null?'':x).trim()).filter(Boolean);if(!items.length)return f.empty?esc(FL(f,'empty')):null;return items.length>1?items.map(x=>'• '+ub(x)).join('<br>'):ub(items[0])}
    case 'number':{const s=String(raw).trim();return s?'<bdi dir="ltr">'+esc(s)+'</bdi>':null}
    case 'price':{const n=num(raw);if(!n)return(f.zeroUnset&&print)?esc(T('undef')):null;return money(n)}
    case 'date':return raw?fdate(raw):null;
    case 'seg':{const o=(f.opts||[]).find(o=>o.v===raw);return o?esc(FO(f,o)):null}
    case 'step':{const n=parseInt(raw)||0;return n?fmtDur(n,f.unit):esc(FL(f,'none')||'—')}
    case 'dur':{const n=parseInt(raw.n)||0;return n?fmtDur(n,raw.u):esc(FL(f,'none')||'—')}
  }
  return null;
}
const HEAD=['brand','model','pay','date'];

  const title=named||(tf?String(v[tf.id]).trim():T('noName'));
  const pf=F.find(f=>f.id==='pay'),po=pf&&pf.opts.find(o=>o.v===v.pay);
  const badge=po?'<button type="button" class="badge t-'+po.tone+'" data-a="pay" data-id="'+r.id+'" title="'+esc(T('badge.tip'))+'">'+esc(FO(pf,po))+' <span aria-hidden="true">⇄</span></button>':'';
  const df=F.find(f=>f.id==='date');
  const meta='<div class="meta"><span>'+esc(T('no'))+' '+r.no+'</span>'+(v.date&&df?'<span>'+esc(FL(df,'label'))+esc(T('colon'))+fdate(v.date)+'</span>':'')+'</div>';
  let lines='';
  F.forEach(f=>{
    if(HEAD.includes(f.id))return;
    if(f.type==='items'){
      const its=itemsOf(v[f.id]);if(!its.length)return;
      lines+='<div class="ln"><span class="k">'+esc(FL(f,'label'))+'</span></div>'+its.map(o=>'<div class="ln item"><span class="k">'+ub(o.t)+'</span><span class="v">'+(o.p?money(o.p):'—')+'</span></div>').join('');

    lines+='<div class="ln'+(f.type==='price'?' price':'')+'"><span class="k">'+esc(FL(f,'label'))+'</span><span class="v">'+h+'</span></div>';
  });
  const id=' data-id="'+r.id+'"';
  const acts=K==='repair'
    ?'<button type="button" class="ok" data-a="done"'+id+'>'+esc(T('act.done'))+'</button><button type="button" data-a="edit"'+id+'>'+esc(T('act.edit'))+'</button><button type="button" data-a="receipt"'+id+'>'+esc(T('act.receipt'))+'</button>'
    :'<button type="button" data-a="edit"'+id+'>'+esc(T('act.edit'))+'</button><button type="button" data-a="receipt"'+id+'>'+esc(T('act.receipt'))+'</button><button type="button" class="danger" data-a="del"'+id+'>'+esc(T('act.del'))+'</button>';
  return '<article class="rec"><div class="rec-h"><div><div class="t">'+ub(title)+'</div>'+meta+'</div>'+badge+'</div>'+
    (lines?'<div class="lines">'+lines+'</div>':'')+'<div class="acts">'+acts+'</div></article>';
}

/* ---------- Toast avec annulation ---------- */
let tt;
function hideToast(){$('#toast').classList.remove('show')}
function toast(msg,undo){
  const el=$('#toast');el.innerHTML='';
  const s=document.createElement('span');s.textContent=msg;el.append(s);
  if(undo){const b=document.createElement('button');b.type='button';b.textContent=T('undo');b.onclick=()=>{undo();hideToast()};el.append(b)}
  el.classList.add('show');clearTimeout(tt);tt=setTimeout(hideToast,undo?6000:2200);
}

const isWide=()=>!!(window.matchMedia&&matchMedia('(min-width:900px)').matches);
function hasContent(sec,v){
  return sec.fields.some(f=>{
    if(f.hidden)return false;
    const x=v[f.id];
    if(f.type==='items')return itemsOf(x).length>0;
    if(f.type==='multi')return Array.isArray(x)&&x.some(t=>String(t).trim());
    if(f.type==='price')return num(x)>0;
    if(['text','long','number'].includes(f.type))return String(x==null?'':x).trim()!=='';
    return false;
  });
}
function save(){
  const sec=cur(),vals=readForm();
  Object.keys(vals).forEach(k=>{const x=vals[k];if(typeof x==='string')vals[k]=x.trim();else if(Array.isArray(x))vals[k]=(x.length&&typeof x[0]==='object')?itemsOf(x):x.map(t=>String(t).trim()).filter(Boolean)});
  if(!hasContent(sec,vals)){toast(T('toast.fillFirst'));const f=$('#f [data-f],#f [data-m]');f&&f.focus();return}
  if(edit){
    const r=sec.recs.find(r=>r.id===edit);
    if(r){r.v=Object.assign({},r.v,vals);persist();openReceipt(r,K,{saved:true,onClose:backToOps})}
    else backToOps();
    return;
  }
  sec.seq++;
  const r={id:uid(),no:sec.seq,v:vals,ts:Date.now()};
  sec.recs.unshift(r);
  draft[K]=null;persist();loadVals();renderForm();
  openReceipt(r,K,{saved:true,onClose:()=>{if(isWide()){const f=$('#f [data-f]');f&&f.focus()}else window.scrollTo(0,0)}});
}
function delField(id){
  snapshot();

  f.hidden=true;persist();renderForm();

function doAdd(){

function removeRec(id,msg){

    }

    return '<div class="row'+(f.id==='price'?' tot':'')+'"><b>'+esc(FL(f,'label'))+'</b><span>'+h+'</span></div>';

/* ---------- Mot de passe (facultatif) ---------- */
async function hashPw(p,salt){
  const s=salt+'|'+p;
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return 'S'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'J'+(4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
async function checkPw(p){return !!S.pw&&(await hashPw(p,S.pw.salt))===S.pw.hash}

/* ---------- Paramètres ---------- */
let pwMode='';
const sc=$('#setCard');
function pwf(id,label,ac){
  return '<div><div class="lab"><label for="'+id+'">'+esc(label)+'</label></div><input id="'+id+'" type="password" autocomplete="'+ac+'"></div>';
}
function renderSettings(){
  const ic='<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  let h='<div class="card"><div class="card-h"><h2>'+esc(T('set.lang'))+'</h2></div>'+langSwitch('full',false)+'<div class="hint">'+esc(T('set.langHint'))+'</div></div>';
  h+='<div class="card" style="margin-top:14px"><div class="card-h"><h2>'+esc(T('set.shop'))+'</h2></div>';
  if(DEMO){
    h+='<div class="lab"><label for="sn">'+esc(T('set.shopName'))+'</label></div><input id="sn" type="text" maxlength="50" value="'+esc(S.shop)+'" autocomplete="off">'+
       '<div class="hint">'+esc(T('set.demoHint'))+'</div>';
  }else{
    h+='<div class="lockedname">'+ic+'<span>'+esc(S.shop)+'</span></div>'+
       '<div class="hint">'+esc(T('set.lockedHint'))+'</div>';
  }
  h+='</div><div class="card" style="margin-top:14px"><div class="card-h"><h2>'+esc(T('set.pw'))+'</h2></div><div class="stack">';
  if(pwMode){
    const ok={set:T('set.pwSave'),change:T('set.pwChange'),remove:T('set.pwRemove')}[pwMode];
    h+='<div class="panel" style="margin-top:0">'+
      (pwMode!=='set'?pwf('pwCur',T('set.pwCur'),'current-password'):'')+
      (pwMode!=='remove'?pwf('pwNew',pwMode==='set'?T('set.pw'):T('set.pwNew'),'new-password')+pwf('pwNew2',T('set.pwConfirm'),'new-password'):'')+
      '<div id="pwErr" class="err"></div>'+
      '<div class="prow"><button type="button" class="btn pri" data-sact="pwok">'+esc(ok)+'</button><button type="button" class="btn" data-sact="pwcancel">'+esc(T('cancel'))+'</button></div></div>';
  }else if(S.pw){
    h+='<span class="stat">'+esc(T('set.pwOn'))+'</span>'+
      '<div class="hint" style="margin-top:0">'+esc(T('set.pwOnHint'))+'</div>'+
      '<div class="prow"><button type="button" class="btn" data-sact="pwchange">'+esc(T('set.change'))+'</button><button type="button" class="btn" data-sact="pwremove" style="color:var(--danger)">'+esc(T('set.remove'))+'</button></div>';
  }else{
    h+='<span class="stat off">'+esc(T('set.pwOff'))+'</span>'+
      '<div class="hint" style="margin-top:0">'+esc(T('set.pwOffHint'))+'</div>'+
      '<button type="button" class="btn" data-sact="pwset">'+esc(T('set.pwSet'))+'</button>';
  }
  h+='</div></div>';
  sc.innerHTML=h;
}
function pwErr(m){const e=$('#pwErr');if(e)e.textContent=m}
async function pwSubmit(){
  const v=id=>{const e=$('#'+id);return e?e.value:''};
  if(pwMode==='change'||pwMode==='remove'){
    if(!(await checkPw(v('pwCur')))){pwErr(T('err.pwCur'));const e=$('#pwCur');e&&e.focus();return}
  }
  if(pwMode==='remove'){
    delete S.pw;persist();pwMode='';renderAll();toast(T('toast.pwRemoved'));return;
  }
  const a=v('pwNew'),b=v('pwNew2');
  if(a.length<4){pwErr(T('err.pwShort'));return}
  if(a!==b){pwErr(T('err.pwMatch'));return}
  const salt=uid();
  S.pw={salt:salt,hash:await hashPw(a,salt)};
  const was=pwMode;pwMode='';persist();flush();renderAll();
  toast(T(was==='set'?'toast.pwOn':'toast.pwChanged'));
}
sc.addEventListener('click',e=>{
  const t=e.target.closest('button[data-sact]');if(!t)return;
  const a=t.dataset.sact;
  if(a==='pwok'){pwSubmit();return}
  if(a==='pwcancel'){pwMode='';renderSettings();return}
  pwMode=a.slice(2);renderSettings();
  const f=sc.querySelector('input');f&&f.focus();
});
sc.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.type==='password'){e.preventDefault();pwSubmit()}});
sc.addEventListener('input',e=>{
  if(e.target.id==='sn'){S.shop=e.target.value;persist();const sn=$('#shopn');sn.textContent=S.shop||T('shop.ph');sn.classList.toggle('empty',!S.shop)}
});

/* ---------- Langue : sélecteur, application, bascule ---------- */
const LN={ar:'العربية',en:'English',fr:'Français'},SH={ar:'عربي',en:'EN',fr:'FR'};
function langSwitch(cls,short){
  return '<div class="lang '+(cls||'')+'" role="group" aria-label="'+esc(T('lang.label'))+'">'+LANGS.map(l=>'<button type="button" data-lang="'+l+'" lang="'+l+'" aria-pressed="'+(l===L)+'" class="'+(l===L?'on':'')+'">'+(short?SH[l]:LN[l])+'</button>').join('')+'</div>';
}
function applyStatic(){
  const h=document.documentElement;h.lang=L;h.dir=L==='ar'?'rtl':'ltr';
  document.title=T('app.title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=T(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=T(e.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',T(e.dataset.i18nAria))});
}
function setLang(l){
  if(!LANGS.includes(l)||l===L)return;
  snapshot();
  const seeds=LANGS.map(x=>tr(x,'shop.demo'));
  L=l;S.lang=l;
  if(DEMO&&seeds.includes(S.shop))S.shop=T('shop.demo');
  try{localStorage.setItem(LK,l)}catch(e){}
  persist();
  applyStatic();hideToast();
  if(!gate.hidden)rerenderGate();else renderAll();
  if(mctx&&!$('#modal').hidden){const html=ticketHTML(mctx.r,mctx.k);$('#paper').innerHTML=html;$('#printArea').innerHTML=html}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)setLang(b.dataset.lang)});
/* chiffres arabes-indiens (٠١٢…) et séparateurs arabes → chiffres latins, en direct */
document.addEventListener('input',e=>{
  const el=e.target;if(!el||!el.dataset||!el.dataset.nm)return;
  let v=nd(el.value).replace(/[^\d.]/g,'');
  if(el.dataset.nm==='int')v=v.replace(/\./g,'');
  else{const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'')}
  if(v!==el.value)el.value=v;
},true);

/* ---------- Écrans d'accès : mot de passe, première configuration ---------- */
const gate=$('#gate');
let gateMode='',gateArg='';
function rerenderGate(){
  if(gateMode==='lock')showLock();
  else if(gateMode==='setup'){const i=$('#sName');showSetup(i?i.value:'')}
  else if(gateMode==='confirm')showConfirm(gateArg);
}
function sampleTicket(name){
  const n=String(name||'').trim(),sl=id=>T('fd.sale.'+id+'.label');
  const rows=[[sl('brand'),'Samsung'],[sl('model'),'A52'],[sl('date'),fdate(today())],[sl('cond'),esc(T('fd.sale.cond.o.new'))]]
    .map(r=>'<div class="row"><b>'+esc(r[0])+'</b><span>'+r[1]+'</span></div>').join('')+
    '<div class="row tot"><b>'+esc(sl('price'))+'</b><span>'+money(25000)+'</span></div>';
  return '<div class="tk"><h1'+(n?'':' class="ph0"')+'>'+(n?esc(n):esc(T('shop.ph')))+'</h1><div class="sub">'+esc(T('rc.sale'))+' · '+esc(T('no'))+' 1</div>'+rows+
    '<div class="foot"><div class="thx">'+esc(T('rc.thanks'))+'</div></div></div>';
}
function boot(){
  gateMode='';gate.hidden=true;gate.innerHTML='';
  if(S.view==='repair'||S.view==='sale')K=S.view;else if(S.view==='ops')K=S.opsTab;
  loadVals();renderAll();
}
function afterUnlock(){
  if(!DEMO&&!S.shop.trim())showSetup('');else boot();
}
function showLock(){
  gateMode='lock';gate.hidden=false;
  gate.innerHTML='<div class="gcard">'+'<h2>'+esc(T('g.lockTitle'))+'</h2><p class="gp">'+esc(T('g.lockP'))+'</p>'+
    '<input id="lpw" type="password" autocomplete="current-password" placeholder="'+esc(T('g.pwPh'))+'"><div id="lerr" class="err"></div>'+
    '<button type="button" id="lgo" class="primary">'+esc(T('g.unlock'))+'</button></div>';
  const inp=$('#lpw');
  const go=async()=>{
    if(await checkPw(inp.value))afterUnlock();
    else{$('#lerr').textContent=T('g.wrong');inp.value='';inp.focus()}
  };
  $('#lgo').addEventListener('click',go);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  inp.focus();
}
function showSetup(pre){
  gateMode='setup';gate.hidden=false;
  gate.innerHTML='<div class="gcard">'+'<h2>'+esc(T('g.welcome'))+'</h2>'+
    '<p class="gp">'+esc(T('g.welcomeP'))+'</p>'+
    '<input id="sName" type="text" maxlength="50" placeholder="'+esc(T('shop.ph'))+'" autocomplete="off">'+
    '<div><div class="gprev-t">'+esc(T('g.preview'))+'</div><div class="gpaper"><div class="gpin" id="sPrev"></div></div></div>'+
    '<button type="button" id="sGo" class="primary" disabled>'+esc(T('g.continue'))+'</button></div>';
  const inp=$('#sName'),pv=$('#sPrev'),go=$('#sGo');
  inp.value=pre||'';
  const upd=()=>{pv.innerHTML=sampleTicket(inp.value);go.disabled=!inp.value.trim()};
  inp.addEventListener('input',upd);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){e.preventDefault();showConfirm(inp.value.trim())}});
  go.addEventListener('click',()=>{if(inp.value.trim())showConfirm(inp.value.trim())});
  upd();inp.focus();
}
function showConfirm(name){
  gateMode='confirm';gateArg=name;
  gate.innerHTML='<div class="gcard">'+'<h2>'+esc(T('g.confirmTitle'))+'</h2><div class="gname">'+esc(name)+'</div>'+
    '<div class="gwarn">'+esc(T('g.warn'))+'</div>'+
    '<div class="gpaper"><div class="gpin">'+sampleTicket(name)+'</div></div>'+
    '<button type="button" id="cOk" class="primary">'+esc(T('g.confirmOk'))+'</button>'+
    '<button type="button" id="cBack" class="btn">'+esc(T('g.editName'))+'</button></div>';
  $('#cOk').addEventListener('click',()=>{S.shop=name;persist();flush();boot()});
  $('#cBack').addEventListener('click',()=>showSetup(name));
}
$('#lockBtn').addEventListener('click',()=>{snapshot();closeSide();flush();showLock()});

applyStatic();
loadState().then(st=>{
  if(st){S=st;L=LANGS.includes(st.lang)?st.lang:'fr'}
  normalize();
  S.lang=L;
  try{localStorage.setItem(LK,L)}catch(e){}
  applyStatic();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(S.pw)showLock();else afterUnlock();
});
})();
